<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3Skill — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1DA64A;
  --brand-dark:#128038;
  --brand-bright:#22C55E;
  --brand-light:#EAFBF0;
  --ink:#0F172A;
  --ink-soft:#5B6472;
  --card:#FFFFFF;
  --line:#E4EFE8;
  --page-bg:#F6FBF7;
  --danger:#D64545;
  --radius:18px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--page-bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;}

.topbar{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;}
.topbar .logo{font-family:'Poppins';font-weight:800;font-size:22px;color:var(--brand-dark);letter-spacing:-.5px;}
.topbar .logo span{color:var(--ink);}

#app{max-width:480px;margin:0 auto;padding:0 20px;}
.screen{display:none;}
.screen.active{display:flex;}
.screen.active{min-height:80vh;align-items:center;justify-content:center;flex-direction:column;}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:40px 32px;width:100%;text-align:center;box-shadow:0 24px 48px -24px rgba(15,23,42,.18);}
.brand-badge{width:56px;height:56px;border-radius:16px;background:linear-gradient(160deg,var(--brand-bright),var(--brand-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:800;font-size:19px;margin:0 auto 18px;box-shadow:0 10px 20px -8px rgba(18,128,56,.5), inset 0 1px 0 rgba(255,255,255,.4);}
.card h1{font-size:22px;margin-bottom:6px;}
.card p{color:var(--ink-soft);font-size:14px;margin:0 0 24px;}

.card input{width:100%;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;font-family:'Inter';margin-bottom:18px;outline:none;transition:border-color .15s ease;text-align:left;}
.card input:focus{border-color:var(--brand);}

.role-label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);text-align:left;margin-bottom:10px;}
.role-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.role-card{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;transition:border-color .15s ease, background .15s ease;display:flex;align-items:center;gap:12px;}
.role-card:hover{border-color:var(--brand);}
.role-card.selected{border-color:var(--brand);background:var(--brand-light);}
.role-icon{width:36px;height:36px;border-radius:10px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;}
.role-card.selected .role-icon{background:var(--brand);}
.role-text strong{display:block;font-family:'Poppins';font-weight:700;font-size:14px;}
.role-text span{font-size:12px;color:var(--ink-soft);}

.btn{appearance:none;border:none;cursor:pointer;border-radius:999px;font-family:'Poppins';font-weight:700;font-size:15px;padding:13px 20px;width:100%;transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;position:relative;overflow:hidden;text-decoration:none;display:inline-block;text-align:center;}
.btn:active{transform:translateY(1px) scale(.99);}
.btn-brand{background:linear-gradient(180deg,var(--brand-bright) 0%,var(--brand) 55%,var(--brand-dark) 100%);color:#fff;box-shadow:0 8px 18px -4px rgba(18,128,56,.45), inset 0 1px 0 rgba(255,255,255,.35);}
.btn-brand::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0));pointer-events:none;border-radius:999px 999px 0 0;}
.btn-brand:hover{filter:brightness(1.04);}
.btn-brand:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none;}

.error-msg{font-size:13px;color:var(--danger);margin-top:14px;}

.loader{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;margin-bottom:16px;}
@keyframes spin{to{transform:rotate(360deg);}}
#redirecting p{color:var(--ink-soft);font-size:14px;margin-bottom:14px;}
.switch-link{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}
</style>
</head>
<body>

<div class="topbar"><div class="logo">3<span>Skill</span></div></div>

<div id="app">

  <section id="loginForm" class="screen active">
    <div class="card">
      <div class="brand-badge">3S</div>
      <h1>Welcome to 3Skill</h1>
      <p>Enter your email — we'll take you straight to your dashboard</p>

      <input id="emailInput" type="email" placeholder="Put your registered email" autocomplete="email">

      <button class="btn btn-brand" id="continueBtn" disabled>Continue</button>
      <p class="error-msg" id="formError" style="display:none;"></p>
    </div>
  </section>

  <section id="checking" class="screen">
    <div class="card">
      <div class="loader" style="margin-left:auto;margin-right:auto;"></div>
      <p id="checkingText">Checking your account…</p>
    </div>
  </section>

  <section id="redirecting" class="screen">
    <div class="card">
      <div class="loader" style="margin-left:auto;margin-right:auto;"></div>
      <p>Taking you to your dashboard…</p>
      <button class="switch-link" id="cancelRedirectBtn">Not you? Switch email</button>
    </div>
  </section>

</div>

<script>
/**
 * For each dashboard, paste BOTH its backend API URL (the Apps Script Web
 * App — used only to silently check "does this email exist here?") and its
 * live frontend page URL (where the person actually gets sent once found).
 */
const ROLES = [
  {
    key: 'student',
    apiUrl: 'https://script.google.com/macros/s/AKfycbx_a5Y3-tj1-HNpk0TBPvxqM1AuSefX4TSQiwLR7zrmfoi3g6VqIcz3ahHSbSUrIVKz1w/exec',
    dashboardUrl: 'project-internship-dashboard.html'
  },
  {
    key: 'training',
    apiUrl: 'https://script.google.com/macros/s/AKfycbxgmkkYg7UkPsIejoWbnqsLpHR2luSGu4N_-cINH8qBrCi7wPov1stR9j4d2aRdwfju/exec',
    dashboardUrl: 'internship-dashnoard.html'
  },
  {
    key: 'mentor',
    apiUrl: 'https://script.google.com/macros/s/AKfycbyA7TgCIrv3YSG5MeIW3Eq_KlVBOtv_8SFWfVUBxMoUxYYc1xSs2Y5tc_Pg7EytyI9pCw/exec',
    dashboardUrl: '3skill-mentor-dashboard.html'
  }
];

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function buildRedirectUrl(dashboardUrl, email){
  var sep = dashboardUrl.indexOf('?') === -1 ? '?' : '&';
  return dashboardUrl + sep + 'email=' + encodeURIComponent(email);
}

// Checks all 3 backends in parallel; returns the first ROLE whose sheet
// actually has this email, or null if it's not found anywhere.
function findRoleForEmail(email){
  var checks = ROLES.map(function(role){
    var url = role.apiUrl + '?action=getDashboardData&email=' + encodeURIComponent(email);
    return fetch(url)
      .then(function(res){ return res.json(); })
      .then(function(data){ return { role: role, found: !!(data && data.found) }; })
      .catch(function(){ return { role: role, found: false }; });
  });
  return Promise.all(checks).then(function(results){
    var match = results.find(function(r){ return r.found; });
    return match ? match.role : null;
  });
}

// ---------- Form ----------
document.getElementById('emailInput').addEventListener('input', function(){
  var email = this.value.trim();
  document.getElementById('continueBtn').disabled = email.indexOf('@') === -1;
});

document.getElementById('continueBtn').addEventListener('click', function(){
  var email = document.getElementById('emailInput').value.trim();
  var errEl = document.getElementById('formError');
  errEl.style.display = 'none';

  if(!email || email.indexOf('@') === -1){
    errEl.textContent = 'Enter a valid email address.';
    errEl.style.display = 'block';
    return;
  }

  showScreen('checking');
  findRoleForEmail(email).then(function(role){
    if(!role){
      showScreen('loginForm');
      errEl.textContent = "We couldn't find this email in any dashboard. Check with admin, or it may take up to 24 hours to activate after enrollment.";
      errEl.style.display = 'block';
      return;
    }
    localStorage.setItem('hubEmail', email);
    localStorage.setItem('hubDashboardUrl', role.dashboardUrl);
    window.location.href = buildRedirectUrl(role.dashboardUrl, email);
  }).catch(function(){
    showScreen('loginForm');
    errEl.textContent = 'Something went wrong while checking your account. Try again.';
    errEl.style.display = 'block';
  });
});

document.getElementById('cancelRedirectBtn').addEventListener('click', function(){
  clearTimeout(window.__hubRedirectTimer);
  localStorage.removeItem('hubEmail');
  localStorage.removeItem('hubDashboardUrl');
  showScreen('loginForm');
});

// ---------- Auto-redirect if we already know who this is ----------
(function(){
  var savedEmail = localStorage.getItem('hubEmail');
  var savedUrl = localStorage.getItem('hubDashboardUrl');
  if(!savedEmail || !savedUrl) return;

  showScreen('redirecting');
  window.__hubRedirectTimer = setTimeout(function(){
    window.location.href = buildRedirectUrl(savedUrl, savedEmail);
  }, 700);
})();
</script>
</body>
</html>
