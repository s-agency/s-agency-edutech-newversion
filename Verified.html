<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3Skill Certificate Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --green-950:#123C29;
    --green-800:#1C6B48;
    --green-700:#238A5C;
    --green-600:#2DA76F;
    --green-500:#45BD87;
    --green-200:#C6ECD7;
    --green-100:#E9F8EF;
    --paper:#F7FBF8;
    --surface:#FFFFFF;
    --line:#DCEDE2;
    --ink:#1B2621;
    --ink-soft:#5E7369;
    --maroon:#8A3324;
    --maroon-bg:#FBEEEA;
    --ring:rgba(45,167,111,0.22);
    --shadow: 0 1px 2px rgba(18,60,41,0.05), 0 12px 28px rgba(18,60,41,0.07);
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper:#0C1712;
      --surface:#12201A;
      --line:#25392F;
      --ink:#EAF3ED;
      --ink-soft:#9DB5A9;
      --green-100:#16281F;
      --green-200:#1E3A2C;
      --maroon-bg:#2A1712;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C1712;
    --surface:#12201A;
    --line:#25392F;
    --ink:#EAF3ED;
    --ink-soft:#9DB5A9;
    --green-100:#16281F;
    --green-200:#1E3A2C;
    --maroon-bg:#2A1712;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px rgba(0,0,0,0.35);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 80px;
  }

  /* subtle paper texture via layered radial dots, kept extremely quiet */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image: radial-gradient(circle at 1px 1px, rgba(28,122,77,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    z-index:0;
  }

  .wrap{ position:relative; z-index:1; width:100%; display:flex; flex-direction:column; align-items:center; }

  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.02em;
    color:var(--green-700);
    margin:0 0 32px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(2rem, 4vw, 2.6rem);
    line-height:1.12;
    color:var(--ink);
    margin:0 0 10px;
    text-align:center;
    max-width:16ch;
  }

  .subtitle{
    color:var(--ink-soft);
    font-size:15.5px;
    line-height:1.5;
    margin:0 0 40px;
    text-align:center;
    max-width:36ch;
  }

  /* ---- Input card ---- */
  .panel{
    width:100%;
    max-width:440px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px;
    box-shadow:var(--shadow);
  }

  .field{ margin-bottom:18px; }

  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }

  .field input{
    width:100%;
    padding:13px 15px;
    font-family:'Inter', sans-serif;
    font-size:15.5px;
    color:var(--ink);
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:10px;
    outline:none;
    transition:border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  .field input::placeholder{ color:#9AAAA0; }

  .field input:focus{
    border-color:var(--green-600);
    background:var(--surface);
    box-shadow:0 0 0 4px var(--ring);
  }

  button.verify{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:var(--green-700);
    color:#FBFEFC;
    border:none;
    padding:14px 16px;
    font-family:'Inter', sans-serif;
    font-size:15.5px;
    font-weight:600;
    border-radius:10px;
    cursor:pointer;
    transition:background 0.18s ease, transform 0.05s ease;
  }

  button.verify:hover{ background:var(--green-600); }
  button.verify:active{ transform:translateY(1px); }
  button.verify:focus-visible{ outline:2px solid var(--green-500); outline-offset:2px; }

  button.verify svg{ width:17px; height:17px; flex:none; }

  /* ---- Result region ---- */
  #result{ width:100%; max-width:440px; margin-top:22px; }

  .state{
    display:flex;
    align-items:center;
    gap:12px;
    padding:16px 18px;
    border-radius:12px;
    font-size:14.5px;
  }

  .state.loading{
    background:var(--green-100);
    color:var(--green-800);
  }
  .state.loading .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--green-600);
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:0.35; transform:scale(0.85); }
    50%{ opacity:1; transform:scale(1); }
  }

  .state.error{
    background:var(--maroon-bg);
    color:var(--maroon);
    align-items:flex-start;
  }
  .state.error svg{ flex:none; margin-top:1px; }

  /* ---- Certificate result card ---- */
  .cert{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:38px 34px 30px;
    text-align:center;
    position:relative;
    animation:stampIn 0.5s cubic-bezier(0.2,0.7,0.2,1) both;
  }
  @media (prefers-reduced-motion: reduce){
    .cert{ animation:none; }
    .seal{ animation:none !important; }
  }
  @keyframes stampIn{
    0%{ opacity:0; transform:translateY(10px) scale(0.98); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }

  .cert-frame{
    position:absolute;
    inset:8px;
    border:1px solid var(--green-200);
    border-radius:12px;
    pointer-events:none;
  }

  .cert-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:22px;
  }

  .seal{
    width:34px; height:34px; color:var(--green-600);
    animation:stampSeal 0.55s 0.15s cubic-bezier(0.2,0.8,0.2,1.2) both;
  }
  @keyframes stampSeal{
    0%{ opacity:0; transform:scale(0.4) rotate(-14deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  .verified-label{
    font-size:13.5px;
    font-weight:600;
    color:var(--green-700);
    letter-spacing:0.01em;
  }

  .lede{
    font-size:14px;
    color:var(--ink-soft);
    font-style:italic;
    font-family:'Fraunces', serif;
    margin:0 0 6px;
  }

  .recipient{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(1.6rem, 4vw, 2rem);
    color:var(--ink);
    margin:0 0 14px;
    line-height:1.2;
    word-break:break-word;
  }

  .flourish{
    width:120px; height:10px;
    margin:0 auto 16px;
    color:var(--green-500);
  }

  .field-note{
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.55;
    margin:0 0 26px;
    max-width:34ch;
    margin-left:auto;
    margin-right:auto;
  }
  .field-note strong{ color:var(--ink); font-weight:600; }

  .details{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    border-top:1px solid var(--line);
    padding-top:18px;
  }

  .details .col{
    padding:0 8px;
    border-left:1px solid var(--line);
  }
  .details .col:first-child{ border-left:none; }

  .details .col .k{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .details .col .v{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    line-height:1.35;
  }

  footer{
    margin-top:56px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (max-width:520px){
    .panel, .cert{ padding:26px 20px; }
    .details{ grid-template-columns:1fr; row-gap:14px; }
    .details .col{ border-left:none; border-top:1px solid var(--line); padding-top:12px; }
    .details .col:first-child{ border-top:none; padding-top:0; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <p class="wordmark">3Skill</p>

    <h1>Certificate Verification</h1>
    <p class="subtitle">Enter a certificate ID to confirm it was issued by 3Skill.</p>

    <div class="panel">
      <div class="field">
        <label for="certID">Certificate ID</label>
        <input type="text" id="certID" placeholder="e.g. 3S-2026-04831" autocomplete="off">
      </div>
      <button class="verify" onclick="verifyCertificate()">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M17 17l-4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Verify certificate
      </button>
    </div>

    <div id="result"></div>

    <footer>Verified records are issued and maintained by 3Skill.</footer>
  </div>

<script>
  async function verifyCertificate() {
    const certID = document.getElementById("certID").value.trim();
    const resultDiv = document.getElementById("result");

    if (!certID) {
      resultDiv.innerHTML = errorState("Enter a certificate ID to continue.");
      return;
    }

    resultDiv.innerHTML = loadingState();

    const url = "https://script.google.com/macros/s/AKfycbwgYcUtD3FJLoFBng8tCFUYC_EJcnM8xzq0Dvg9DI7PRprMmLX7YL0y_D4CJGayBJwlRw/exec?certID="
              + encodeURIComponent(certID);

    try {
      const response = await fetch(url);
      const data = await response.json();

      if (data.found) {
        resultDiv.innerHTML = certificateCard(data);
      } else {
        resultDiv.innerHTML = errorState("No certificate matches that ID. Double-check and try again.");
      }
    } catch (err) {
      console.error(err);
      resultDiv.innerHTML = errorState("Couldn't reach the verification server. Please try again shortly.");
    }
  }

  function loadingState(){
    return `<div class="state loading"><span class="dot"></span> Verifying certificate…</div>`;
  }

  function errorState(message){
    return `<div class="state error">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 6.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="10" cy="13.2" r="0.9" fill="currentColor"/>
      </svg>
      <span>${escapeHtml(message)}</span>
    </div>`;
  }

  function certificateCard(data){
    const name = escapeHtml(data.name || "");
    const field = escapeHtml(data.internshipField || "—");
    const type = escapeHtml(data.internshipType || "—");
    const duration = escapeHtml(data.internshipDuration || "—");
    const issued = escapeHtml(formatDate(data.issueDate));

    return `
    <div class="cert">
      <div class="cert-frame"></div>
      <div class="cert-top">
        <svg class="seal" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="20" cy="20" r="13.5" stroke="currentColor" stroke-width="1" opacity="0.5"/>
          <path d="M13.5 20.5l4 4 9-9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="verified-label">Certificate verified</span>
      </div>

      <p class="lede">This certifies that</p>
      <p class="recipient">${name}</p>

      <svg class="flourish" viewBox="0 0 120 10" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="5" x2="46" y2="5" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="60" cy="5" r="3" fill="currentColor"/>
        <line x1="74" y1="5" x2="120" y2="5" stroke="currentColor" stroke-width="1.2"/>
      </svg>

      <p class="field-note">successfully completed the <strong>${field}</strong> internship as a <strong>${type}</strong> intern with 3Skill.</p>

      <div class="details">
        <div class="col">
          <p class="k">Type</p>
          <p class="v">${type}</p>
        </div>
        <div class="col">
          <p class="k">Duration</p>
          <p class="v">${duration}</p>
        </div>
        <div class="col">
          <p class="k">Issued</p>
          <p class="v">${issued}</p>
        </div>
      </div>
    </div>`;
  }

  function formatDate(isoString) {
    const date = new Date(isoString);
    if (isNaN(date.getTime())) return isoString || "—";
    const options = { year: 'numeric', month: 'long', day: 'numeric' };
    return date.toLocaleDateString('en-US', options);
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  document.getElementById('certID').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verifyCertificate();
  });
</script>
</body>
</html>
